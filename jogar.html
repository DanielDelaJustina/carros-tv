<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pó e Pólvora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/jogo.css">
</head>
<body>
  <div id="gl"></div>
  <div class="vinheta"></div>
  <div id="hud">
    <div class="topo"><div class="t1 titulo">PÓ &amp; PÓLVORA</div><div class="t2">INCURSÃO NO DESERTO</div></div>
    <div class="canto"><span class="caixinha" id="fps">-- fps</span><span class="caixinha verde" id="qtd">0/2 JOGADORES</span><button class="caixinha botaoCanto" id="btTela2">⛶</button></div>
    <canvas id="mapa"></canvas>
    <div id="placar"></div>
    <div id="mensagem"></div>
    <div id="resultado" class="escondido"></div>
    <div id="etiquetas"></div>
    <div id="divisor"></div>
    <div id="avisos"></div>
    <div id="mini" class="escondido"><div class="qr" id="qrMini"></div><div class="txt">Entrar:<b id="codMini">-----</b></div></div>
    <div id="cartoes"></div>
    <div id="lobby">
      <div class="qr" id="qr"></div>
      <div>
        <h1 class="titulo">PÓ &amp; PÓLVORA</h1>
        <div class="sub">Aponte a câmera do celular para o QR code<br>ou abra o endereço e digite o código:</div>
        <div class="cod" id="cod">-----</div>
        <div class="link" id="link"></div>
        <button id="btSom" autofocus>🔊 Ativar som</button> <button id="btTela" class="btLobby">⛶ Tela cheia</button>
      </div>
    </div>
    <div id="erros"></div>
  </div>
  <div class="carregando titulo" id="carregando">MONTANDO O DESERTO…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/mundo.js"></script>
  <script src="js/carros.js"></script>
  <script src="js/rede.js"></script>
  <script src="js/incursao.js"></script>
  <script src="js/jogar.js"></script>
</body>
</html>
