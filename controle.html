<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#120d0a">
  <title>Pó e Pólvora · controle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/jogo.css">
</head>
<body class="cel">
  <!-- entrar -->
  <div class="tela entrar" id="telaEntrar">
    <h1 class="titulo">PÓ &amp; PÓLVORA</h1>
    <div class="sala">Sala <b id="salaCod">-----</b></div>
    <input id="nome" maxlength="12" placeholder="Seu nome" autocomplete="off">
    <div class="escolhaPapel">
      <button class="papel sel" data-papel="piloto">🚗 PILOTO<span>dirige o próprio carro</span></button>
      <button class="papel" data-papel="artilheiro">🎯 ARTILHEIRO<span>cuida das armas do carro do outro</span></button>
    </div>
    <div class="dicaArt" id="dicaArt" style="display:none">Você vai girar a torre e atirar enquanto o outro dirige.</div>
    <div class="escolha" id="escolhaCarro">
      <button class="opcao sel" data-carro="buggy">
        <svg viewBox="0 0 120 60"><g fill="none" stroke="#ffb347" stroke-width="3" stroke-linejoin="round">
          <path d="M18 38 L24 28 L48 26 L56 14 L82 14 L92 26 L104 30 L106 38 Z" fill="#3a2414"/>
          <path d="M56 14 L50 4 L84 4 L82 14 M50 4 L44 26"/><path d="M66 4 L66 -2 M66 2 L90 2"/></g>
          <circle cx="32" cy="42" r="12" fill="#1a1817" stroke="#888" stroke-width="3"/><circle cx="92" cy="42" r="13" fill="#1a1817" stroke="#888" stroke-width="3"/></svg>
        <b>BUGGY</b><span>pula pedras, segura bem na curva</span>
      </button>
      <button class="opcao" data-carro="muscle">
        <svg viewBox="0 0 120 60"><g fill="#3a2414" stroke="#ffb347" stroke-width="3" stroke-linejoin="round">
          <path d="M6 40 L8 30 L34 26 L46 16 L74 16 L86 26 L112 28 L114 40 Z"/><path d="M50 12 L84 12 L84 7 L50 7 Z"/></g>
          <path d="M2 34 L-4 34 M114 34 L120 34" stroke="#ccc" stroke-width="3"/>
          <circle cx="28" cy="42" r="10" fill="#1a1817" stroke="#ccc" stroke-width="3"/><circle cx="92" cy="42" r="10" fill="#1a1817" stroke="#ccc" stroke-width="3"/></svg>
        <b>MUSCLE</b><span>mais rápido, derrapa mais</span>
      </button>
    </div>
    <button class="btGrande" id="btEntrar">ENTRAR</button>
    <div class="girar">Dica: deite o celular para jogar.</div>
  </div>

  <!-- jogo -->
  <div class="tela jogo" id="telaJogo">
    <div class="barraTopo" id="barraTopo">
      <b id="eu">—</b><span id="estado">conectando…</span><span class="esp"></span>
      <button id="btComecar" class="comecar">▶ COMEÇAR</button><button id="btEstrada">↺ Estrada</button><button id="btTrocar">Carro</button><button id="btSair">Sair</button><button id="btTela">⛶</button>
    </div>
    <div class="vel"><div id="infoJogo" class="infoJogo"></div><b id="kmh">0</b> km/h<div class="vb"><i id="vidaBar"></i></div><div class="nb"><i id="nitroBar"></i></div></div>
    <button class="bt" id="btNitro">🔥 NITRO<small id="nitroQtd">3 de 3</small></button>
    <button class="bt" id="btMissil">🚀 MÍSSIL<small id="missilQtd">3 de 3</small></button>
    <button class="bt" id="btEscudo">🛡 ESCUDO<small id="escudoQtd">pronto</small></button>
    <button class="bt" id="btAcel">ACELERA</button>
    <button class="bt" id="btRe">FREIO / RÉ</button>
    <div id="avisoCel" class="avisoCel escondido"></div>
    <div id="menuModo" class="menuModo escondido">
      <b>Escolha o modo</b>
      <button class="modo" data-modo="0">💥 INCURSÃO<span>5 ondas de robôs, chefão no fim</span></button>
      <button class="modo" data-modo="1">🏁 CORRIDA ARMADA<span>3 voltas contra robôs, vale atalho e tiro</span></button>
      <button class="modo" data-modo="2">🚚 COMBOIO<span>protejam o caminhão-tanque até a bandeira</span></button>
      <button id="btFecharModo" class="fechar">voltar</button>
    </div>
    <div id="direcao"><div class="base" id="dBase"></div><div class="pino" id="dPino"></div><div class="dica" id="dicaDir">arraste para os lados</div></div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/rede.js"></script>
  <script src="js/controle.js"></script>
</body>
</html>
